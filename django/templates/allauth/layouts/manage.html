{% extends "allauth/layouts/base.html" %}
{% load static account_navigation i18n %}
{% block content_outer %}
<div class="auth-layout auth-layout--manage">
    <a class="auth-back-link" href="{% account_back_url %}">← {% trans "Back to website" %}</a>
    <div class="hs-card">
        {% block card_header %}
            <div class="auth-card__brand">
                <img src="{% static 'img/icon-color-thick.svg' %}" alt="HydroServer" class="auth-card__logo">
            </div>
        {% endblock %}
        {% block content %}{% endblock %}
    </div>
</div>
{% endblock %}
